services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: invest-forest-server:latest
    container_name: invest-forest-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: invest-forest-web:latest
    container_name: invest-forest-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://server:8080
    depends_on:
      server:
        condition: service_healthy

networks:
  default:
    name: invest-forest-network
